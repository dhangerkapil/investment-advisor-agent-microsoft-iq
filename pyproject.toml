[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investment-advisor-agent-microsoft-iq"
version = "1.0.0"
description = "Investment Advisor Agent with Microsoft IQ: a Foundry hosted agent harness grounded in Work IQ, Fabric IQ, Foundry IQ and Web IQ"
requires-python = ">=3.12"
dependencies = [
  "agent-framework-core>=1.22.0,<2",
  "agent-framework-foundry>=1.15.0,<2",
  "agent-framework-foundry-hosting==1.0.0b261015",
  "agent-framework-azure-cosmos==1.0.0b261015",
  # Microsoft Purview on the agent's turns (ADVISOR_PURVIEW; off unless Terraform's enable_purview turns it on).
  "agent-framework-purview==1.0.0b261015",
  "azure-ai-agentserver-optimization==1.0.0b1",
  # agent-framework-foundry 1.15 caps azure-ai-projects below 2.8; the eval tooling uses 2.9 (evals/requirements-foundry.txt).
  "azure-ai-projects>=2.7,<2.8",
  "azure-identity>=1.26,<2",
  "azure-keyvault-keys>=4.11,<5",
  "cryptography>=46,<48",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  # agent-framework-foundry-hosting requires mcp<2.
  "mcp>=1.24,<2",
  "msal>=1.39,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pypdf>=6.1,<7",
  "pypdfium2>=4.30,<5",
  "pyyaml>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.13,<1", "pyright>=1.1.400,<2"]
ui = ["ag-ui-protocol>=0.1.14,<0.2"]

[project.scripts]
workplace-agent = "workplace_agent.app:main"
workplace-demo = "workplace_agent.demo:main"
workplace-auth = "workplace_agent.broker:main"
workplace-ui = "workplace_agent.ui.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workplace_agent"]

[tool.uv]
# Prereleases only where a dependency pins one (the Foundry hosting, Cosmos, Purview and optimization packages are betas).
prerelease = "if-necessary"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
